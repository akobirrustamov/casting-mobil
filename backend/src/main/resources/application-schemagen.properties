# Faqat sxema DDL generatsiyasi uchun vaqtinchalik profil.
#
# Hibernate DDL'ni DIALEKT bo'yicha yasaydi, haqiqiy bazaga qaramaydi —
# shuning uchun ulanish H2'ga, dialekt esa PostgreSQL. Natija: prod uchun
# yaroqli SQL, lekin hech qanday bazaga tegilmaydi.
#
# Ishlatish:
#   java -jar backend/target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=schemagen
#   -> backend/target/schema-postgres.sql

spring.datasource.url=jdbc:h2:mem:schemagen;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=backend/target/schema-postgres.sql
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;

app.jwt.secret=schemagen0000000000000000000000000000000000000000000000000000
app.dev.seed=false
app.local.seed=false
server.port=8099
spring.flyway.enabled=false
