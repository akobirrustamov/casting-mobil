# ==========================================================================
#  DEV PROFIL - lokal ishlab chiqish va brauzerda test uchun
# ==========================================================================
#
# Nega H2, PostgreSQL emas:
# lokal Postgres (5432) ishlayapti, lekin unga parol ma'lum emas va unda
# haqiqiy casting ma'lumoti bo'lishi mumkin. Test ma'lumotini u yerga
# yozish xavfli. H2 esa alohida fayl - hech narsaga tegmaydi.
#
# Ishga tushirish (repozitoriy ILDIZIDAN, boshqa joydan emas -
# AttachmentServiceImpl fayllarni nisbiy 'backend/files' yo'lidan qidiradi):
#
#   java -jar backend/target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#
# Baza fayli: backend/data/uzcasting-dev.mv.db  (gitignore'ga qo'shilgan)
# O'chirib tashlash = toza boshlash.

spring.datasource.url=jdbc:h2:file:./backend/data/uzcasting-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=4415

# ⚠️ Yuqoridagi parol jar ichiga tushadi va buni ONGLI ravishda qabul
# qilamiz — `SecretsAndLoggingTest` shu belgi tufayli bu faylni
# tekshirmaydi.
#
# Nega xavfsiz: bu H2 ning FAYL bazasi paroli
# (`backend/data/uzcasting-dev.mv.db`). Baza tarmoqda emas, faqat shu
# kompyuterda, ichida esa generatsiya qilingan mock ma'lumot. Faylni
# o'qiy oladigan odam parolsiz ham hammasini ko'ra oladi.
#
# Nega qiymat o'zgartirilmadi: baza fayli allaqachon SHU parol bilan
# yaratilgan. Boshqasiga almashtirilsa mavjud dev bazasi ochilmay
# qoladi.
#
# ⚠️ Belgi BUTUN faylni tekshiruvdan chiqaradi. Bu yerga HAQIQIY sir
# (prod baza paroli, S3 kaliti, Eskiz paroli) yozilmasin — qo'riqchi
# endi ularni ushlamaydi.
app.config.jar-secrets-acknowledged=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dev'da ham FLYWAY — migratsiyalar har kuni ishga tushirilib tekshiriladi.
# Agar migratsiya sinsa, buni prod'da emas, shu yerda bilib olamiz.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Prod'da ham true - CastingUser.photos lazy yuklanadi va JSON'ga o'girilganda kerak.
spring.jpa.open-in-view=true

# H2 konsoli ATAYLAB o'chiq: u alohida servlet qo'shadi va Spring Security
# pattern turini aniqlay olmay ilova ko'tarilmaydi (mobile/docs/LOCAL_BACKEND.md).
spring.h2.console.enabled=false

server.port=8080
server.address=0.0.0.0

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Dev uchun kalit. Prod'da APP_JWT_SECRET env orqali beriladi.
app.jwt.secret=dev0123456789abcdef0123456789abcdef0123456789abcdef0123456789ab23

# Mock ma'lumot generatsiyasi. Faqat shu profilda true.
app.dev.seed=true

# Casting modulining eski sealkasi - dev'da kerak emas.
app.local.seed=false

logging.level.com.example.backend=DEBUG

# Lokal ishlab chiqish uchun master hisoblar (AutoRun).
# Prod'da bu qiymatlar YO'Q — u yerda parol environment orqali beriladi.
# ⚠️ Siyosat dev profilida ham YOQILGAN.
#
# Ilgari bu yerda `app.bootstrap.allow-weak-password=true` turardi —
# u parol siyosatini butunlay o'chirardi va hisoblar `00000000`
# paroli bilan yaratilardi.
#
# Parollar endi siyosatdan o'tadi, demak uni o'chirishga hojat yo'q.
# Yopiq qoldirgani muhim: jar SERVERDA `--spring.profiles.active=dev`
# bilan ishga tushirilishi mumkin (xato xabari shu yo'lni taklif
# qiladi) va o'shanda zaif parolli admin ochilib qolardi.
app.bootstrap.allow-weak-password=false
app.gipersuperadmin.password=dev00000000
app.superadmin.password=dev00000000
app.legacy-admin.password=dev00000000

# --- Panel hisoblari (AutoRun yaratadi) ---
#
# Bu to'rttasi lokal ishlab chiqish uchun. Har biri boshqa ROL:
#   gipersuperadmin  HYPER_ADMIN   - hamma narsa
#   superadmin       SUPER_ADMIN   - Admin va Worker yarata oladi
#   admin            ADMIN         - faqat Worker yarata oladi
#   worker           WORKER        - ruxsatlari panelda beriladi
#
# ⚠️ Worker RUXSATSIZ yaratiladi. Bu ataylab: ruxsatni Admin beradi va
# u amal auditga tushadi (ТЗ §12). Avtomatik berish o'sha izni hech
# kim bermagan holga keltirardi.
app.admin.phone=admin
app.admin.password=dev00000000
app.worker.phone=worker
app.worker.password=dev00000000

# OpenAPI dev'da ochiq: /swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
