# ==========================================================================
#  LOCAL profili — telefondan sinash uchun lokal backend
# ==========================================================================
#  Ishga tushirish (repozitoriy ILDIZIDAN, `backend/` dan emas):
#
#    mvn -f backend/pom.xml -DskipTests package
#    java -jar backend/target/backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=local
#
#  Batafsil: mobile/docs/LOCAL_BACKEND.md
#
#  ⚠️ Bu faylda HECH QANDAY SIR YO'Q va bo'lmasligi ham kerak: baza
#  xotirada, JWT kaliti faqat shu stend uchun yasalgan, Eskiz kabineti
#  umuman ishlatilmaydi. Shu sababli u `.gitignore` da ISTISNO qilingan
#  — xuddi `application-test.properties` kabi.
#
#  Ilgari bu fayl repozitoriyga tushmagan edi va toza klonda hujjatda
#  yozilgan `--spring.profiles.active=local` HECH NARSA qilmasdi:
#  ilova ishlab chiquvchining shaxsiy Postgres'iga ulanardi, seed
#  ishlamasdi, telefon orqali kirish esa `SMS_NOT_CONFIGURED` berardi.
# ==========================================================================

# -- Baza: xotiradagi H2, PostgreSQL rejimida ------------------------------
#
# Postgres ham, parol ham kerak emas. Har ishga tushishda baza toza —
# bu ataylab: sinov ma'lumoti to'planib qolmaydi va tozalash shart emas.
spring.datasource.url=jdbc:h2:mem:uzcasting-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=postgres
spring.datasource.password=4415

# WARNING: DIALEKT ANIQ KO'RSATILADI.
#
# `application.properties` da PostgreSQL dialekti turibdi va u prod uchun
# to'g'ri. H2 esa uni tushunmaydi (`skip locked` va shu kabi SQL) —
# `application-test.properties` da bu xato allaqachon bosib o'tilgan.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Sxemani FAQAT Flyway boshqaradi — ishlab chiqarishdagi kabi (TZ §91).
# Hibernate `create-drop` qilsa, lokalda ishlagan narsa migratsiyalarda
# yo'q bo'lishi mumkin edi va buni faqat deploy paytida bilinardi.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# WARNING: `true` — ISHLAB CHIQARISH bilan bir xil, va bu ATAYLAB.
#
# Eski casting moduli unga tayanadi: `CastingUser.photos` lazy yuklanadi
# va JSON'ga o'girilganda sessiya kerak. `false` bo'lsa
# `/api/v1/casting-user/web` 500 qaytaradi.
spring.jpa.open-in-view=true

# WARNING: H2 konsoli YOQILMAYDI.
#
# `spring.h2.console.enabled=true` alohida servlet qo'shadi, shundan
# keyin Spring Security `SecurityConfig` dagi naqshlar turini aniqlay
# olmaydi va ilova "cannot decide whether these patterns are Spring MVC
# patterns" bilan YIQILADI. Baza xotirada — konsolning foydasi ham yo'q.
spring.h2.console.enabled=false

# -- Tarmoq ----------------------------------------------------------------
#
# WARNING: `0.0.0.0` — telefon uchun SHART. `localhost` ga bog'lansa,
# telefon uchun bu manzil O'ZI bo'ladi va ilova hech narsa yuklamaydi.
server.port=8080
server.address=0.0.0.0

# -- Sinov ma'lumotlari ----------------------------------------------------
#
# `app.local.seed` — eski casting anketalari (LocalSeeder: 12 anketa, 27 foto)
# `app.dev.seed`   — yangi CMS kontenti: bosh sahifa, premyeralar, epizodlar
#                    (DevDataSeeder). Usiz `/api/v1/app/home` bo'sh keladi.
app.local.seed=true
app.dev.seed=true

# -- JWT -------------------------------------------------------------------
#
# WARNING: FAQAT shu stend uchun. Serverda kalit environmentdan keladi va
# u hech qachon repozitoriyda turmaydi.
app.jwt.secret=6c6f63616c6465766c6f63616c6465766c6f63616c6465766c6f63616c646576
app.jwt.access-token-ms=900000
app.jwt.refresh-token-ms=86400000

# WARNING: `false` — lokalda HTTP ishlatiladi, `Secure` cookie esa faqat
# HTTPS orqali yuboriladi. Ishlab chiqarishda bu HECH QACHON `false`
# bo'lmasligi kerak.
app.auth.cookie-secure=false

# -- SMS (OTP) -------------------------------------------------------------
#
# WARNING: Bu yerda ESKIZ SOZLAMALARI YO'Q va kerak ham emas.
#
# `local` profilida `EskizSmsClient` umuman yaratilmaydi — uning o'rnida
# `LoggingSmsClient` turadi va kodni SMS o'rniga KONSOLGA yozadi:
#
#     ============================================================
#      LOKAL OTP  ·  +998901234567
#      UzCasting platformasida ro'yxatdan o'tish uchun tasdiqlash kod: 4821
#     ============================================================
#
# Ya'ni telefon orqali kirish va ro'yxatdan o'tish Eskiz kabinetisiz
# to'liq sinaladi.

# Lokalda kutib o'tirmaslik uchun qayta yuborish oralig'i qisqartirilgan.
# Serverda 120 soniya (spam va SMS xarajati uchun) — bu yerda kod baribir
# logga chiqadi, demak cheklovning ma'nosi yo'q.
app.otp.ttl-seconds=600
app.otp.resend-cooldown-seconds=5
app.otp.max-attempts=5

# -- Google OAuth ----------------------------------------------------------
#
# Bo'sh qoldirilsa `/api/v1/auth/google` 503 qaytaradi (soxta muvaffaqiyat
# yo'q). Google orqali kirishni sinash uchun mobile/docs/GOOGLE_AUTH.md
# dagi client ID'larni vergul bilan ajratib shu yerga yozing.
#
# WARNING: Telefon orqali kirish uchun bu KERAK EMAS.
app.google.client-ids=497193534365-urqt7p6tufge2qpqhdns5qv8nvshjsqe.apps.googleusercontent.com,497193534365-03mh4geit6f6n13enrf2bqcs8dhcp1cb.apps.googleusercontent.com

# -- Fayllar ---------------------------------------------------------------
#
# S3 emas, lokal disk: `backend/files/`. Shuning uchun jar ildizdan
# ishga tushiriladi — `AttachmentServiceImpl` nisbiy yo'ldan o'qiydi.
app.storage.provider=local
app.upload.temp-dir=target/local-uploads

# -- Log -------------------------------------------------------------------
#
# OTP kodi ko'rinishi uchun Sms paketi INFO darajasida bo'lishi shart.
logging.level.com.example.backend.Sms=INFO
logging.level.com.example.backend.Config.LocalSeeder=INFO
logging.level.com.example.backend.Cms.Dev=INFO
