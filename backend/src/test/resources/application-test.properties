# ==========================================================================
#  TEST profili — repozitoriyda TURISHI SHART
# ==========================================================================
#  Bu yerda hech qanday sir yo'q: baza xotirada, JWT kaliti faqat testlar
#  uchun yasalgan. Fayl bo'lmasa esa butun to'plam ishlab chiquvchining
#  shaxsiy bazasiga ulanadi va yuzlab test kod butunlay to'g'ri bo'lsa ham
#  yiqiladi. `DatabaseRulesTest` uning borligini alohida tekshiradi.
#
#  ⚠️ `.gitignore` da istisno bor, lekin u uzoq vaqt ISHLAMAGAN: yo'l
#  `src/test/resources/...` deb yozilgani uchun `backend/src/...` ga tushmasdi.
#  Shu sababli fayl repozitoriyga umuman kirmagan va toza klonda testlarni
#  ishga tushirib bo'lmasdi.
# ==========================================================================

spring.datasource.url=jdbc:h2:mem:uzcasting-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sxemani faqat Flyway boshqaradi (ТЗ §91) — ishlab chiqarishdagi kabi.
spring.jpa.hibernate.ddl-auto=none
# ⚠️ `true` — ISHLAB CHIQARISH bilan bir xil.
#
# Bu odatda antinaqsh va uni `false` qilish to'g'ri ko'rinadi. Lekin
# eski casting moduli unga TAYANADI: `CastingUser.photos` lazy
# yuklanadi va JSON'ga o'girilganda sessiya kerak bo'ladi.
#
# `false` bo'lsa `/api/v1/casting-user/web` 500 qaytaradi —
# `application.properties` da bu aniq yozilgan.
#
# ⚠️ Test profili prod'dan FARQ qilsa, testlar ishlaydigan tizimni
# emas, boshqa narsani sinaydi. Bu yerda aynan shunday bo'ldi:
# `false` yozilgach 4 ta eski test yiqildi, lekin ishlab chiqarishda
# hech narsa o'zgarmagan edi.
#
# Lazy yuklashni to'g'ri hal qilish (DTO yoki `join fetch`) — alohida
# ish va u eski, MUZLATILGAN modulga tegadi.
spring.jpa.open-in-view=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# `TestDatabaseReset` har yurishda `flyway.clean()` chaqiradi: testlar qat'iy
# telefon raqamlari bilan ma'lumot yaratadi va oldingi yurishdan qolgan
# satrlar ularni `DUPLICATE_PHONE` bilan yiqitardi.
#
# ⚠️ Ishlab chiqarishda bu DOIM `true` — `DatabaseRulesTest` ikkalasini ham
# qo'riqlaydi, aks holda keyingi odam buni "qoida buzilgan" deb tuzatib
# qo'yardi.
spring.flyway.clean-disabled=false

# Yuborilgan SQL'ni yozib boradi — N+1 va sahifalash testlari shundan o'qiydi.
spring.jpa.properties.hibernate.session_factory.statement_inspector=com.example.backend.support.CapturingStatementInspector

# `ChunkedUploadTest` bu kalitni standart qiymatsiz so'raydi.
app.upload.temp-dir=target/test-uploads

# Faqat testlar uchun. Ishlab chiqarish kaliti environmentdan keladi.
app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.jwt.access-token-ms=6000000
app.jwt.refresh-token-ms=86400000

logging.level.root=WARN

# ⚠️ DIALEKT ANIQ KO'RSATILADI.
#
# `application.properties` da `PostgreSQLDialect` turibdi va u prod
# uchun to'g'ri. Testlar esa H2 da ishlaydi — PostgreSQL dialekti
# u yerda `skip locked` kabi H2 tushunmaydigan SQL chiqaradi.
#
# ⚠️ Bu uzoq vaqt YASHIRIN qoldi: `application.properties` dagi buzuq
# `${...}` havolasi tufayli dialekt sozlamasi umuman qo'llanmayotgan
# edi va Hibernate H2 dialektini o'zi tanlardi. Havola tuzatilgach
# prod dialekti testlarga ham tushdi va o'nlab test yiqildi.
#
# Endi har muhit o'z dialektini ANIQ oladi — tasodifga tayanmaydi.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================================================
#  Transcoding worker — TESTLARDA O'CHIRILADI
# ==========================================================================
#  ⚠️ `TranscodeWorker` izohida «testlarda o'chiriladi» deb yozilgan
#  edi, lekin bu satr hech qachon qo'shilmagan. Ya'ni izoh mavjud
#  bo'lmagan xatti-harakatni tasvirlardi.
#
#  Oqibati: worker har 15 soniyada navbatni tekshirib, TEST yaratgan
#  ishni o'zi olib qo'yardi. Test esa `QUEUED` kutardi va `PROBING`
#  ko'rardi.
#
#  Bu jimgina emas, TASODIFIY nosozlik: u faqat poll vaqti test
#  bilan mos tushganda chiqadi. Shuning uchun u «goh o'tadi, goh
#  o'tmaydi» bo'lib ko'rinardi va sabab har safar boshqa testda
#  ko'rinardi.
app.video.worker-enabled=false
